[project]
version = "0.14.0"
repo = "github.com/zillionare/louke"
project = "louke-0.14.0"
project_id = "https://github.com/users/quantclaws/projects/20"
spec_id = "v0.14-002-workflow-reflow-design"
# Legacy compatibility pointer only; Runtime authority is the release bundle.
legacy_spec_id = "v0.14-002-workflow-reflow-design"
legacy_spec_id_authoritative = false
contract_bundle_id = "louke-v0.14.0-entry-contract-bundle"
contract_bundle_path = ".louke/project/release-contract-bundle.json"
contract_bundle_release = "0.14.0"
contract_bundle_entry_spec = "v0.14-001-workflow-reflow-spec"
contract_bundle_mode = "development_bootstrap"
release_branch = "releases/0.14.0"

[meta]
created = "2026-07-16"
current_stage = "M-MILESTONE"
security_audit = "disabled"
pre_commit = "installed (python + base)"
acknowledged_orphan_releases = ["releases/v0.10", "releases/v0.11", "releases/v0.4", "releases/v0.8"]
smoke_test_issue = "#207 (closed)"
smoke_test_pr = "#208 (closed)"
dod = "v0.13.1: project-local install + AC@version + pre-commit gate (lock v0.13.1)"

story = """
v0.13.1-002-project-local-install-experience：完成 v0.13.0 之后识别出的两个紧耦合缺口，使用户能在 5 分钟内把 louke 装到新项目、已有全局 louke 的用户能迁移到项目内 louke 而不动全局、release 时 louke 包版本自动与 git tag 同步。
"""
test_framework = "pytest"
backlog_project = "https://github.com/users/quantclaws/projects/10"


[active_specs]
# 当前活跃 spec 列表 (post-v0.7 hotfix)
v0_7_001 = "shipped (2026-07-05, tag v0.7.0)"
v0_7_002 = "shipped (2026-07-08, tag v0.7.3)"
v0_8_001 = "shipped (2026-07-09, v0.10 web server)"
v0_11_001 = "shipped (2026-07-11, tag v0.11.0; web-ide API + 6 sub-apps)"
v0_11_002 = "paused (web-ui-integration; superseded for new work by v0.12 Projects UI contract)"
v0_12_001 = "shipped (2026-07-15, tag v0.12.1; programmatic-workflow-runtime stabilization)"
v0_13_001 = "shipped (2026-07-16, tag v0.13.0; web-ui-foundation)"
v0_13_1_002 = "shipped (2026-07-16, tag v0.13.1; project-local install experience + AC@version + pre-commit gate)"

[integration]
# The bootstrap resolves the repository `.venv` and rejects PATH/system Python.
# v0.14-004 assets exercise the real Starlette assembly with external stand-ins.
# v0.14-005 adds public-surface ATDD integration and host-neutral fixtures.
paths = ["tests/e2e", "tests/integration", "tests/fixtures", "tests/ground_truth", "tests/integration/v014_workspace_onboarding", "tests/fixtures/v014_workspace_onboarding", "tests/integration/v014_atdd_process_improvement", "tests/fixtures/v014_atdd_process_improvement"]
run = "tests/e2e/run-project-venv integration"
framework = "pytest"
cwd = "."

[e2e]
# The runner owns installed-wheel service startup, readiness and finally teardown.
# `--runtime both` executes isolated local and global installation profiles.
run = "tests/e2e/run-project-venv e2e --profile all --runtime both -m \"not v014_005_full_lifecycle\""
framework = "pytest"
cwd = "."
paths = ["tests/e2e", "tests/fixtures", "tests/ground_truth", "tests/e2e/v014_workspace_onboarding", "tests/fixtures/v014_workspace_onboarding", "tests/e2e/v014_atdd_process_improvement", "tests/fixtures/v014_atdd_process_improvement"]
ready_timeout_seconds = 60
